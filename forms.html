<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Forms</title>
</head>
<body>
    <form method="post">
        <fieldset>
            <label>Name:</label>
            <input type="text" placeholder="Galen Ray Surendra">
            <br>
            <label>Birthday</label>
            <input type="date">
            <br>
            <label>Are you a troll?</label>
            <input type="checkbox">
            <br>
            <textarea rows="10" cols="20" placeholder="Send something nice my way"></textarea>
        </fieldset>
        <label>What's your favourite colour?</label>
        <br>
        <select>
            <optgroup label="Rainbow Colours">
                <option>Red</option>
                <option>Orange</option>
                <option>Yellow</option>
                <option>Green</option>
                <option>Blue</option>
                <option>Purple</option>
            </optgroup>
            <optgroup label="Invisible Colours">
                <option>Infrared</option>
                <option>Ultraviolet</option>
            </optgroup>
        </select>
        <br>
        <button>Send</button>
    </form>
    <a href="./index.html">Country roads, take me home</a>
</body>
</html>
